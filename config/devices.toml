# Hardware for this installation. ASTRO_SIM=1 ignores this file and uses simulators.

[finder]
driver = "svbony"      # svbony
model = "SV905C"
exposure_s = 0.8       # from the 2026-10-03 sweep: >= 0.8 s solved every time
gain = 200

[main]
driver = "svbony"      # svbony | none
model = "SV705C"

[mount]
driver = "solve"       # mcu (encoders via the Nano) | handset (IntelliScope RS-232) | solve (finder only)
port = ""              # mcu: empty = first ttyACM*, then ttyUSB*; handset: empty = /dev/ttyUSB0.
                       # Set explicitly when both are plugged in (classic Nano and handset are both ttyUSB*).
counts_per_rev = 9216
az_sign = -1           # XT8i: counts fall as the base turns clockwise (seen from above)
alt_sign = 1
