[project]
name = "astro"
version = "0.1.0"
description = "Voice-guided push-to and astrophotography for an 8-inch Dobsonian"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "timezonefinder>=6", "astropy>=6", "scipy>=1.11", "astroalign>=2.5", "pyserial>=3.5", "fastapi>=0.110", "uvicorn[standard]>=0.29", "anthropic>=0.40", "pillow>=10", "pygeomag>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]
tools = ["opencv-python-headless>=4.8", "matplotlib>=3.8"]  # hwcheck scripts; viewer_plot needs python3-tk

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
tmp_path_retention_policy = "failed"  # recording tests write ~1 GB per run

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["E", "W", "I", "B", "UP", "PLC0415"]  # PLC0415: imports at the top of files
ignore = ["E501"]  # long lines are judged in review: wrapping URLs and tables hurts more
