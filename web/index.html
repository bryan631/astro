<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astro</title>
<link rel="manifest" href="manifest.json">
<style>
  :root { --bg: #000; --fg: #ff3b30; --dim: #7a1c17; }
  body.day { --bg: #111; --fg: #f2f2f2; --dim: #555; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 28px/1.3 system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 24px; min-height: 100vh; }
  #said { font-size: 36px; text-align: center; min-height: 3em; max-width: 30ch; }
  #arrow { font-size: 160px; line-height: 1; transition: transform .2s; }
  #dist { font-size: 40px; }
  #talk { width: 70vmin; height: 70vmin; max-width: 320px; max-height: 320px; border-radius: 50%;
          border: 6px solid var(--fg); background: transparent; color: var(--fg); font-size: 40px; }
  #talk { touch-action: none; }  /* a press is never a scroll (which cancels it) */
  #talk.listening { background: var(--dim); }
  /* Night: pictures in dim red too, so they don't spoil dark-adapted eyes. */
  body:not(.day) #live, body:not(.day) #gallery img, body:not(.day) #camimg {
    filter: grayscale(1) sepia(1) saturate(5) hue-rotate(-50deg) brightness(.6); }
  /* Hands-free state: text, dot and border weight differ, so it reads in dim red at night. */
  #vstate { font-size: 28px; padding: 8px 20px; border: 2px solid var(--dim); border-radius: 999px; }
  #vstate::before { content: "\25CB  "; }
  #vstate[data-s="hearing"], #vstate[data-s="armed"] { border-color: var(--fg); border-width: 5px; }
  #vstate[data-s="armed"]::before, #vstate[data-s="hearing"]::before { content: "\25CF  "; }
  #vstate[data-s="speaking"] { border-style: dashed; border-color: var(--fg); }
  #vstate[data-s="speaking"]::before { content: "\25B6  "; }
  #heard { font-size: 24px; min-height: 1.3em; opacity: .8; }
  #views button.on { border-color: var(--fg); border-width: 4px; }
  #camview { width: 100%; max-width: 900px; text-align: center; }
  #camimg { width: 100%; border: 2px solid var(--dim); border-radius: 12px; }
  #camcap { font-size: 20px; opacity: .8; }
  #debugbox { width: 100%; max-width: 900px; font: 20px/1.35 ui-monospace, monospace; white-space: pre-wrap;
              border: 2px solid var(--dim); border-radius: 12px; padding: 12px; margin: 0; }
  #typed { display: flex; gap: 8px; width: 100%; max-width: 600px; }
  #typed input, button.small { font-size: 24px; padding: 12px; background: var(--bg); color: var(--fg);
          border: 2px solid var(--dim); border-radius: 12px; }
  #typed input { flex: 1; }
  .on-target #arrow { color: #34c759; }
  #live { width: 100%; max-width: 900px; border: 2px solid var(--dim); border-radius: 12px; }
  #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; width: 100%; max-width: 900px; }
  #gallery img { width: 100%; border: 2px solid var(--dim); border-radius: 12px; }
  body.on-target:not(.day) #arrow { color: var(--fg); }
</style>
</head>
<body>
  <div id="said">Hold the button and say "what's good tonight?"</div>
  <div id="arrow" hidden>&#x2191;</div>
  <div id="dist"></div>
  <img id="live" hidden alt="live stack">
  <button id="talk">Hold to talk</button>
  <button id="hands" class="small">Hands-free: off</button>
  <div id="vstate" hidden></div>
  <div id="heard"></div>
  <form id="typed"><input id="text" placeholder="or type here" autocomplete="off"><button class="small">Send</button></form>
  <div id="views"><button class="small" data-v="finder">Finder</button> <button class="small" data-v="main">Main camera</button> <button class="small" data-v="debug">Debug</button> <button class="small" id="vid" hidden>Live video</button></div>
  <div id="camview" hidden><img id="camimg" alt="camera view"><div id="camcap"></div></div>
  <pre id="debugbox" hidden></pre>
  <div><button class="small" id="mode">Day mode</button> <button class="small" id="pics">Pictures</button> <button class="small" id="beeps">Beeps off</button></div>
  <div id="gallery" hidden></div>
<script>
const HINT = `Hold the button and say "what's good tonight?"`;
const heardEl = document.getElementById("heard"), said = document.getElementById("said"), arrow = document.getElementById("arrow"),
      dist = document.getElementById("dist"), talk = document.getElementById("talk");
let ws, unavailable = false, armedUntil = 0, handsOn = false, serverStt = false, serverTts = false, player = null;
const pending = [];  // sent while reconnecting: delivered once the socket is back
function connect() {
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.binaryType = "blob";
  ws.onopen = () => { if (handsOn) wsSend(JSON.stringify({type: "handsfree", on: true}));
    while (pending.length) ws.send(pending.shift()); };
  ws.onmessage = e => typeof e.data === "string" ? handle(JSON.parse(e.data)) : play(e.data);
  ws.onclose = () => setTimeout(connect, unavailable ? 10000 : 1000);  // slow retries while the hardware is down
}
function report(text) {  // show a browser-side failure and tell the server (remote support reads its log)
  heardEl.textContent = text; wsSend(JSON.stringify({type: "client_log", text}));
}
addEventListener("error", e => report(`Page error: ${e.message}`));
addEventListener("unhandledrejection", e => report(`Page error: ${e.reason && e.reason.message || e.reason}`));
function stopAudio() { speechSynthesis.cancel(); if (player) player.pause(); }
function play(blob) {  // server (Piper) speech; newest cue wins
  stopAudio(); player = new Audio(URL.createObjectURL(blob));
  player.play().catch(e => report(`The browser blocked speech: ${e.message}`));
}
function speak(text) {
  if (serverTts) return;  // audio arrives separately as a binary message
  stopAudio();
  const u = new SpeechSynthesisUtterance(text); u.rate = 0.95; speechSynthesis.speak(u);
}
function handle(m) {
  if (m.type === "unavailable") {  // startup failed: show the error, say it once
    said.textContent = m.text;
    if (!unavailable) speak("The telescope isn't ready.");
    unavailable = true;
  }
  if (m.type === "notice") said.textContent = m.text;  // a button's answer: shown, not spoken
  if (m.type === "view") setView(m.what === "none" ? "" : m.what, !!m.video);
  if (m.type === "hello") { unavailable = false; serverStt = m.server_stt; serverTts = m.server_tts; setupTalk(); }
  if (m.type === "heard") { armedUntil = 0; said.textContent = `“${m.text}”`; heardEl.textContent = `Command: “${m.text}”`; }
  if (m.type === "ignored") heardEl.textContent = `Heard, no “Astro”: “${m.text}”`;
  if (m.type === "armed") armedUntil = performance.now() + m.seconds * 1000;
  if (m.type === "get_location") sendLocation(m.id);
  if (m.type === "picture" && !document.getElementById("gallery").hidden) showPictures();
  if (m.type === "live") {  // live stack preview: same file, rewritten as frames are added
    const img = document.getElementById("live");
    img.src = `${m.url}?n=${m.frames}`; img.hidden = false;
  }
  if (m.type === "picture") document.getElementById("live").hidden = true;
  if (m.type === "hold") { arrow.hidden = true; dist.textContent = "Hold still"; holding = true; }
  if (m.type === "say" && holding && !m.text.startsWith("Hold still")) {  // e.g. "stop"
    holding = false; dist.textContent = "";
  }
  if (m.type === "say") { said.textContent = m.text; speak(m.text); }
  if (m.type === "state") {
    holding = false;
    beepHz = m.on_target ? 0 : m.beep_hz; stateAt = performance.now();
    arrow.hidden = false;
    document.body.classList.toggle("on-target", m.on_target);
    if (m.on_target) { arrow.innerHTML = "&#x25CF;"; arrow.style.transform = ""; dist.textContent = "On target"; return; }
    arrow.innerHTML = "&#x2191;";
    // Screen up = push up; screen right = the user's right (learned server-side, G3).
    const right = m.right_is_plus_az === false ? -m.d_az_sky_deg : m.d_az_sky_deg;
    const angle = Math.atan2(right, m.d_alt_deg) * 180 / Math.PI;
    arrow.style.transform = `rotate(${angle}deg)`;
    const d = m.distance_deg;
    dist.textContent = d >= 1 ? `${d.toFixed(0)}°` : `${(d * 60).toFixed(0)}′`;
  }
}
// Tablet GPS for the observing site (setup, or "use my location"). Needs HTTPS.
function wsSend(data) { ws && ws.readyState === WebSocket.OPEN ? ws.send(data) : pending.push(data); }
function liveSend(data) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(data); }  // hands-free speech: stale once the link is back
function sendLocation(id) {  // echo the request id so stale answers can be ignored
  if (!navigator.geolocation) {
    wsSend(JSON.stringify({type: "location_error", id, message: "This browser has no location service."}));
    return;
  }
  navigator.geolocation.getCurrentPosition(
    p => wsSend(JSON.stringify({type: "location", id, lat: p.coords.latitude, lon: p.coords.longitude,
                                 alt: p.coords.altitude, accuracy: p.coords.accuracy})),
    e => wsSend(JSON.stringify({type: "location_error", id, message: e.message})),
    {enableHighAccuracy: true, timeout: 20000, maximumAge: 0});  // always a fresh fix
}
function send(text) { if (text.trim()) wsSend(JSON.stringify({type: "text", text})); }
document.getElementById("typed").onsubmit = e => {
  e.preventDefault(); const i = document.getElementById("text"); send(i.value); i.value = "";
};
async function showPictures() {
  const box = document.getElementById("gallery");
  const files = await (await fetch("/gallery")).json();
  box.innerHTML = files.length ? files.map(f => `<a href="/pictures/${f}" target="_blank"><img src="/pictures/${f}" alt="${f}"></a>`).join("")
                               : "<p>No pictures yet.</p>";
  box.hidden = false;
}
document.getElementById("pics").onclick = () => {
  const box = document.getElementById("gallery");
  box.hidden ? showPictures() : (box.hidden = true);
};
document.getElementById("mode").onclick = e => {
  e.target.textContent = document.body.classList.toggle("day") ? "Night mode" : "Day mode";
};

// Optional proximity beeps (G4): faster as the target gets closer.
// States stream at 10 Hz while guiding; when they stop (stop, unsafe, disconnect), the
// beeps stop and the arrow goes away instead of pointing at the last target.
let beepHz = 0, beepsOn = false, audio = null, lastBeep = 0, stateAt = 0, holding = false;
document.getElementById("beeps").onclick = e => {
  beepsOn = !beepsOn;
  e.target.textContent = beepsOn ? "Beeps on" : "Beeps off";
  audio = audio || new AudioContext();  // needs a tap before it may play
};
setInterval(() => {
  const now = performance.now();
  if (now - stateAt > 1000) {
    beepHz = 0;  // no fresh state: paused (hold), stopped or disconnected
    if (!holding && !arrow.hidden) { arrow.hidden = true; dist.textContent = ""; }
  }
  if (!beepsOn || !audio || beepHz <= 0 || now - lastBeep < 1000 / beepHz) return;
  lastBeep = now;
  const osc = audio.createOscillator(), gain = audio.createGain();
  osc.frequency.value = 880; gain.gain.value = 0.1;
  osc.connect(gain).connect(audio.destination);
  osc.start(); osc.stop(audio.currentTime + 0.05);
}, 25);

// Speech input: record and send to the server (whisper.cpp) when available, which works
// offline; otherwise use the browser's recognizer (on Android this may need internet).
let talkReady = false;
function setupTalk() {
  if (talkReady) return; talkReady = true;
  const listen = on => talk.classList.toggle("listening", on);
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  let start, stop;
  if (serverStt && navigator.mediaDevices) {
    let rec, stream = null;  // the mic stays open: reopening it per press clips the first word
    start = async () => {
      stream = stream || await navigator.mediaDevices.getUserMedia({audio: true});
      const chunks = []; rec = new MediaRecorder(stream);
      rec.ondataavailable = e => chunks.push(e.data);
      rec.onstop = () => { listen(false); wsSend(new Blob(chunks, {type: rec.mimeType})); };
      rec.start();
    };
    stop = () => rec && rec.state === "recording" && rec.stop();
  } else if (Rec) {
    const rec = new Rec(); rec.lang = "en-US"; rec.interimResults = false;
    rec.onresult = e => send(e.results[0][0].transcript);
    rec.onend = () => listen(false);
    start = () => rec.start(); stop = () => rec.stop();
  } else {
    talk.textContent = "Type below"; talk.disabled = true; return;
  }
  setupHandsFree(Rec);
  // While the telescope talks, the big button stops it (in either mode) instead of listening.
  const speakingNow = () => speechSynthesis.speaking || (player && !player.paused && !player.ended);
  setInterval(() => {
    const s = !!speakingNow(), label = s ? "Tap to stop talking" : "Hold to talk";
    if (talk.textContent !== label) talk.textContent = label;
    talk.disabled = !s && handsOn;
  }, 150);
  let pressed = false, cancelled = false;
  talk.addEventListener("pointerdown", async e => {
    e.preventDefault();
    if (speakingNow()) { stopAudio(); cancelled = true; return; }  // a tap to stop, not a command
    listen(true); pressed = true;
    try {
      await start();
      if (!pressed) stop();  // let go while the microphone was opening
    } catch (err) {  // e.g. microphone permission denied
      listen(false); said.textContent = `I can't use the microphone: ${err.message}. Type below.`;
    }
  });
  for (const ev of ["pointerup", "pointerleave", "pointercancel"])
    talk.addEventListener(ev, () => { if (cancelled) { cancelled = false; return; } pressed = false; stop(); });
}
// Live camera views and the debug panel: the page polls what the server last captured.
let view = "", viewTimer = null, camUrl = null;
let videoOn = false;
function setView(what, video = false) {
  view = what; videoOn = video; clearTimeout(viewTimer);
  const isCam = what === "finder" || what === "main";
  const img = document.getElementById("camimg"), vid = document.getElementById("vid");
  img.removeAttribute("src");  // drops a running stream, so the server sees nobody watching
  vid.hidden = !isCam; vid.textContent = video ? "Stop video" : "Live video";
  document.getElementById("camview").hidden = !isCam;
  if (video && isCam) {
    img.src = `/api/camera/${what}.mjpg`;
    document.getElementById("camcap").textContent = `${what}: live video`;
    document.querySelectorAll("#views button[data-v]").forEach(b => b.classList.toggle("on", b.dataset.v === what));
    document.getElementById("debugbox").hidden = true;
    return;
  }
  document.getElementById("debugbox").hidden = what !== "debug";
  document.querySelectorAll("#views button").forEach(b => b.classList.toggle("on", b.dataset.v === what));
  if (what) pollView();
}
// Buttons are silent: the server answers only with the view (spoken requests are spoken to).
const video = (camera, then) => wsSend(JSON.stringify({type: "video", camera, then}));
document.getElementById("vid").onclick = () => videoOn ? video(null, view) : video(view);
document.querySelectorAll("#views button[data-v]").forEach(b => b.onclick = () => {
  const next = view === b.dataset.v ? "" : b.dataset.v;
  if (videoOn) video(null, next || "none"); else setView(next);  // video runs until switched off
});
function formatDebug(info) {
  return Object.entries(info).map(([section, vals]) => section.toUpperCase() + "\n" +
    Object.entries(vals).map(([k, v]) => `  ${k}: ${JSON.stringify(v)}`).join("\n")).join("\n\n");
}
async function pollView() {
  const what = view;
  if (!what) return;
  try {
    if (what === "debug") {
      const r = await fetch("/api/debug");
      document.getElementById("debugbox").textContent = r.ok ? formatDebug(await r.json()) : `No debug info: ${await r.text()}`;
    } else {
      const r = await fetch(`/api/camera/${what}.jpg?n=${Date.now()}`);
      if (r.ok && view === what) {
        const url = URL.createObjectURL(await r.blob());
        document.getElementById("camimg").src = url;
        if (camUrl) URL.revokeObjectURL(camUrl);
        camUrl = url;
        document.getElementById("camcap").textContent = `${what}: frame ${r.headers.get("X-Frame-Age")} s old`;
      } else if (!r.ok) {
        const why = (await r.json().catch(() => ({}))).detail || "no frame yet";
        document.getElementById("camcap").textContent = `${what}: ${why}`;
      }
    }
  } catch (e) { report(`View failed: ${e.message}`); }
  if (view === what) viewTimer = setTimeout(pollView, what === "debug" ? 1000 : 1500);
}
// Hands-free (half-duplex): listen continuously, ignore the mic while the telescope is speaking.
// Short commands only. Silero VAD (scripts/install-vad.sh) finds each utterance whatever the mic
// level; the browser's gain control and noise suppression clean the signal first.
const loadScript = src => new Promise((ok, fail) => {
  const el = Object.assign(document.createElement("script"), {src, onload: ok, onerror: () => fail(new Error(`${src} missing; run scripts/install-vad.sh`))});
  document.head.append(el);
});
function setupHandsFree(Rec) {
  const btn = document.getElementById("hands"), vstate = document.getElementById("vstate");
  const TAIL_MS = 600, MAX_UTTERANCE_S = 6, VAD = "/vendor/vad/";  // absolute: onnxruntime import()s its module from here
  let on = false, stream = null, micVad = null, recog = null, wakeLock = null, hearing = false, tainted = false, lastSpoke = 0;
  const speaking = () => speechSynthesis.speaking || (player && !player.paused && !player.ended);
  const states = {waiting: "Say “Astro…”", hearing: "Hearing you…", armed: "Listening for your command",
                  speaking: "Speaking…"};
  setInterval(() => {
    if (speaking()) lastSpoke = performance.now();
    const s = !on ? "" : speaking() ? "speaking" : hearing ? "hearing" : performance.now() < armedUntil ? "armed" : "waiting";
    vstate.hidden = !on; vstate.dataset.s = s; vstate.textContent = states[s] || "";
    if (on) talk.classList.toggle("listening", s === "hearing");  // hold-to-talk owns the class otherwise
  }, 100);
  const quiet = () => !speaking() && performance.now() - lastSpoke > TAIL_MS;
  async function enable() {
    if (serverStt && navigator.mediaDevices) {
      stream = stream || await navigator.mediaDevices.getUserMedia(
        {audio: {autoGainControl: true, noiseSuppression: true, echoCancellation: true}});
      if (!window.vad) { await loadScript(VAD + "ort.wasm.min.js"); await loadScript(VAD + "bundle.min.js"); }
      micVad = await vad.MicVAD.new({
        getStream: async () => stream, baseAssetPath: VAD, onnxWASMBasePath: VAD, model: "v5",
        preSpeechPadMs: 300, redemptionMs: 700, minSpeechMs: 300,  // pre-roll keeps the first word
        onSpeechStart: () => { hearing = true; tainted = !quiet(); },  // started over our own voice
        onVADMisfire: () => { hearing = false; },
        onSpeechEnd: audio => {
          hearing = false;
          if (!tainted && quiet() && audio.length < MAX_UTTERANCE_S * 16000) liveSend(new Blob([vad.utils.encodeWAV(audio)], {type: "audio/wav"}));
        },
      });
      micVad.start();
    } else if (Rec) {  // Chrome's recognizer: continuous, restarted when it ends
      recog = new Rec(); recog.lang = "en-US"; recog.continuous = true;
      recog.onresult = e => { const r = e.results[e.results.length - 1];
        if (r.isFinal && quiet()) liveSend(JSON.stringify({type: "text", text: r[0].transcript, spoken: true})); };
      recog.onend = () => { if (on) try { recog.start(); } catch {} };
      recog.start();
    }
  }
  async function disable() {  // also after a failed enable: never leave the microphone on
    if (micVad) { await micVad.destroy(); micVad = null; }
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
    hearing = false;
    if (recog) { recog.onend = null; recog.stop(); recog = null; }
    talk.classList.remove("listening");
  }
  btn.onclick = async () => {
    on = !on;
    btn.disabled = true;  // loading the voice detector takes a few seconds: show it, ignore taps
    btn.textContent = `Hands-free: ${on ? "starting…" : "stopping…"}`;
    try { if (on) await enable(); else await disable(); }
    catch (err) { on = false; await disable().catch(() => {}); said.textContent = `I can't use the microphone: ${err.message}. Type below.`; }
    btn.disabled = false;
    handsOn = on; armedUntil = 0; wsSend(JSON.stringify({type: "handsfree", on}));
    btn.textContent = `Hands-free: ${on ? "on" : "off"}`; talk.disabled = on;
    if (on) said.textContent = "Say “Astro, what's good tonight?”";  // the hint changes with the mode
    else if (said.textContent.startsWith("Say “Astro")) said.textContent = HINT;
    if (on && navigator.wakeLock) navigator.wakeLock.request("screen")  // keep the tablet awake
      .then(l => { wakeLock = l; l.onrelease = () => { if (wakeLock === l) wakeLock = null; }; }).catch(() => {});
  };
}
connect();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").then(r => r.update());  // installable (V1); check for a new build on every load
</script>
</body>
</html>
