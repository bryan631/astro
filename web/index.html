<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">  <!-- laid out for 1280x800; the tablet (961x601) scales it to fit -->
<title>Astro</title>
<link rel="manifest" href="manifest.json">
<style>
  /* Landscape, one screen, no scrolling: both cameras live on top, buttons along the bottom.
     Everything works with the volume off (Phase 3b): every message is text on the screen. */
  :root { --bg: #000; --fg: #ff3b30; --dim: #7a1c17; --hi: #ff6a5f; }
  body.day { --bg: #111; --fg: #f2f2f2; --dim: #555; --hi: #7cff7c; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }  /* else a hidden sheet's own display covers the buttons */
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 20px/1.3 system-ui, sans-serif;
         display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; height: 100vh; height: 100dvh; overflow: hidden; }  /* dvh: what shows, without Android's bars */
  button { font: inherit; color: var(--fg); background: var(--bg); border: 2px solid var(--dim);
           border-radius: 12px; padding: 10px 16px; touch-action: manipulation; }
  button.on { border-color: var(--fg); border-width: 4px; }
  #status { font-size: 16px; padding: 4px 12px; display: flex; gap: 14px; flex-wrap: wrap; }
  #status .bad { text-decoration: underline; font-weight: bold; }
  #views { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 1fr); gap: 8px; padding: 0 8px; min-height: 0; }
  .view { position: relative; border: 2px solid var(--dim); border-radius: 12px; overflow: hidden;
          display: flex; align-items: center; justify-content: center; min-height: 0; }
  .view > img.cam { max-width: 100%; max-height: 100%; display: block; }
  body:not(.day) img.cam, body:not(.day) #inset, body:not(.day) #viewer img, body:not(.day) #pictures img {
    filter: grayscale(1) sepia(1) saturate(5) hue-rotate(-50deg) brightness(var(--b, .6)); }
  body.day img.cam { filter: brightness(var(--b, 1)); }
  .frame { position: absolute; pointer-events: none; }  /* covers the picture exactly (see fit()) */
  .frame::before, .frame::after { content: ""; position: absolute; background: var(--fg); opacity: .6; }
  .frame::before { left: 0; right: 0; top: 50%; height: 1px; }
  .frame::after { top: 0; bottom: 0; left: 50%; width: 1px; }
  .frame svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .frame polygon { fill: none; stroke: var(--hi); stroke-width: 2px; stroke-dasharray: 6 4;
                   vector-effect: non-scaling-stroke; }
  .label { position: absolute; left: 8px; top: 6px; font-size: 16px; text-shadow: 0 0 4px #000; }
  .cap { position: absolute; left: 8px; bottom: 6px; font-size: 15px; opacity: .85; text-shadow: 0 0 4px #000; }
  .focus { position: absolute; right: 10px; top: 6px; text-align: right; text-shadow: 0 0 4px #000; }
  .focus b { font-size: 34px; } .focus canvas { display: block; margin-left: auto; }
  .focus small { display: block; font-size: 15px; }
  body:not(.focusing) .focus canvas { display: none; }
  body.focusing .focus b { font-size: 64px; }
  .ctl { position: absolute; right: 6px; bottom: 6px; display: flex; gap: 6px; }
  .ctl button { padding: 4px 10px; font-size: 16px; border-radius: 8px; }
  #arrow { position: absolute; font-size: 140px; line-height: 1; opacity: .85; pointer-events: none;
           transition: transform .2s; text-shadow: 0 0 8px #000; }
  #dist { position: absolute; bottom: 40px; font-size: 32px; text-shadow: 0 0 6px #000; }
  #capinfo { position: absolute; left: 8px; bottom: 30px; font-size: 22px; text-shadow: 0 0 4px #000; }
  #capinfo.warn { font-weight: bold; font-size: 28px; }
  #field { position: absolute; width: 40px; height: 40px; margin: -20px 0 0 -20px; border: 2px solid var(--hi);
           border-radius: 50%; }  /* where the stacked field is now (it drifts toward an edge) */
  #inset { position: absolute; right: 8px; top: 120px; width: 34%; border: 2px solid var(--fg);
           border-radius: 8px; background: #000; }
  #msg { padding: 6px 12px; font-size: 22px; min-height: 1.6em; white-space: nowrap; overflow: hidden;
         text-overflow: ellipsis; }
  #buttons { display: flex; gap: 8px; padding: 6px 8px 10px; align-items: stretch; }
  #buttons button { font-size: 22px; padding: 12px 14px; }
  #buttons .grow { flex: 1; }
  #stop { font-weight: bold; font-size: 26px; border: 4px solid var(--fg); padding: 12px 28px; }
  #capture.on { background: var(--dim); }
  .sheet { position: fixed; inset: 0; background: var(--bg); padding: 12px; overflow: auto; z-index: 5; }
  .sheet .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  #targets button { display: block; width: 100%; text-align: left; margin-bottom: 8px; }
  #targets button.down { opacity: .5; }
  #targets small { display: block; font-size: 15px; opacity: .8; }
  #pictures { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
  #pictures button { padding: 0; border: 0; } #pictures img { width: 100%; border-radius: 8px; }
  #viewer { display: flex; flex-direction: column; }
  #viewer .pic { flex: 1; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  #viewer img { max-width: 100%; max-height: 100%; transform-origin: center; }
  #log { font-size: 18px; white-space: pre-wrap; }
  #debugbox { font: 16px/1.35 ui-monospace, monospace; white-space: pre-wrap; }
  .sheet a { color: var(--fg); }
</style>
</head>
<body>
  <div id="status"></div>
  <div id="views">
    <div class="view" id="v-finder">
      <img class="cam" alt="finder camera">
      <div class="frame"><svg viewBox="-0.5 -0.5 1 1" preserveAspectRatio="none"><polygon id="mainbox"/></svg></div>
      <div class="label">Finder</div><div class="focus"><b></b><small></small><canvas width="160" height="40"></canvas></div>
      <div id="arrow" hidden></div><div id="dist"></div>
      <div class="cap"></div>
      <div class="ctl"><button data-b="-">−</button><button data-b="+">+</button><button data-z>1x</button></div>
    </div>
    <div class="view" id="v-main">
      <img class="cam" alt="main camera">
      <div class="frame"><div id="field" hidden></div></div>
      <div class="label">Main camera</div><div class="focus"><b></b><small></small><canvas width="160" height="40"></canvas></div>
      <div id="capinfo"></div><img id="inset" hidden alt="live stack">
      <div class="cap"></div>
      <div class="ctl"><button data-b="-">−</button><button data-b="+">+</button><button data-z>1x</button></div>
    </div>
  </div>
  <div id="msg"></div>
  <div id="buttons">
    <button id="goto">Go to</button><button id="align">Align</button><button id="focus">Focus</button>
    <button id="capture">Capture</button><button id="recenter">Recenter</button>
    <button id="pics">Pictures</button><button id="more">More</button>
    <span class="grow"></span><button id="stop">STOP</button>
  </div>

  <div class="sheet" id="s-goto" hidden><div class="top"><b>Go to</b><button data-close>Close</button></div><div id="targets">Loading…</div></div>
  <div class="sheet" id="s-pics" hidden><div class="top"><b>Pictures</b><button data-close>Close</button></div><div id="pictures"></div></div>
  <div class="sheet" id="viewer" hidden><div class="top"><span>
      <button data-vb="-">−</button> <button data-vb="+">+</button> <button data-vz="1">1x</button> <button data-vz="2">2x</button> <button data-vz="4">4x</button></span>
      <button data-close>Close</button></div><div class="pic"><img alt="picture"></div></div>
  <div class="sheet" id="s-log" hidden><div class="top"><b>Messages</b><button data-close>Close</button></div><div id="log"></div></div>
  <div class="sheet" id="s-more" hidden><div class="top"><b>More</b><button data-close>Close</button></div>
    <p><button id="mode">Day mode</button> <button id="sync">Sync now</button>
       <button data-text="barlow in">Barlow in</button> <button data-text="barlow out">Barlow out</button></p>
    <p><label id="checks" hidden><input type="checkbox" id="checksoff"> Skip safety checks (daytime)</label></p>
    <p><a href="/tonight">Tonight at each spot</a> · <a href="/treeline.html">Record a treeline</a></p>
    <pre id="debugbox"></pre></div>
<script>
const $ = id => document.getElementById(id);
const msgEl = $("msg"), logLines = [];
let ws, unavailable = false;
const pending = [];  // sent while reconnecting: delivered once the socket is back
function connect() {
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.onopen = () => {
    while (pending.length) ws.send(pending.shift());
    setTimeout(() => {  // for fitting the layout to the tablet (remote support reads the log)
      const rows = [...document.body.children].filter(e => e.offsetHeight).map(e => `${e.id} ${e.offsetHeight}`);
      wsSend(JSON.stringify({type: "client_log", text: `screen ${innerWidth}x${innerHeight} css px, dpr ` +
        `${devicePixelRatio}, page ${document.documentElement.scrollWidth}x${document.documentElement.scrollHeight}, ` +
        `rows ${rows.join(", ")}, font ${getComputedStyle(document.body).fontSize}`}));
    }, 3000);
  };
  ws.onmessage = e => { if (typeof e.data === "string") handle(JSON.parse(e.data)); };
  ws.onclose = () => setTimeout(connect, unavailable ? 10000 : 1000);  // slow retries while the hardware is down
}
const wsSend = data => ws && ws.readyState === WebSocket.OPEN ? ws.send(data) : pending.push(data);
const action = (doWhat, target) => wsSend(JSON.stringify({type: "action", do: doWhat, target}));
const sendText = text => wsSend(JSON.stringify({type: "text", text}));
function report(text) {  // a browser-side failure: show it and tell the server (remote support reads its log)
  show(text); wsSend(JSON.stringify({type: "client_log", text}));
}
addEventListener("error", e => report(`Page error: ${e.message}`));
addEventListener("unhandledrejection", e => report(`Page error: ${e.reason && e.reason.message || e.reason}`));
function show(text) {  // the message line, and the log behind it
  msgEl.textContent = text;
  logLines.push(`${new Date().toLocaleTimeString()}  ${text}`);
  if (logLines.length > 100) logLines.shift();
}
function handle(m) {
  if (m.type === "unavailable") { show(m.text); unavailable = true; }
  if (m.type === "hello") unavailable = false;
  if (m.type === "say" || m.type === "notice") show(m.text);
  if (m.type === "get_location") sendLocation(m.id);
  if (m.type === "state") guide(m);
  if (m.type === "hold") { arrow.hidden = true; dist.textContent = "Hold still"; holding = true; }
  if (m.type === "capture") showCapture(m);
  if (m.type === "live") { inset.src = `${m.url}?n=${m.frames}`; inset.hidden = false; }
  if (m.type === "picture") { inset.hidden = true; showCapture({state: "done"}); if (!$("s-pics").hidden) showPictures(); }
}

// --- camera views: always live. Each view asks for a frame newer than the one it shows; the
// server waits for it, so nothing stays open and nothing is downloaded twice.
const views = {finder: {el: $("v-finder"), b: 1, zoom: 1, focus: []}, main: {el: $("v-main"), b: 1, zoom: 1, focus: []}};
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function viewLoop(name) {
  const v = views[name], img = v.el.querySelector("img.cam"), cap = v.el.querySelector(".cap");
  let seq = 0;
  for (;;) {
    try {
      const r = await fetch(`/api/camera/${name}.jpg?after=${seq}`, {cache: "no-store"});
      const age = Number(r.headers.get("X-Frame-Age"));
      if (r.status === 200) {
        seq = Number(r.headers.get("X-Seq")) || seq;
        const url = URL.createObjectURL(await r.blob());
        img.onload = () => { fit(name); URL.revokeObjectURL(url); };
        img.src = url;
        showFocus(name, r.headers.get("X-Focus"), r.headers.get("X-Stars"), r.headers.get("X-Focus-Mode"));
        cap.textContent = age > 3 ? `frame ${age.toFixed(0)} s old` : "";
      } else if (r.status === 204) {
        cap.textContent = `no new frame for ${age.toFixed(0)} s`;
      } else {
        cap.textContent = (await r.json().catch(() => ({}))).detail || `error ${r.status}`;
        await sleep(1000);
      }
    } catch (e) { cap.textContent = "no link to the telescope"; await sleep(1000); }
  }
}
function fit(name) {  // the overlay frame covers the picture exactly, wherever it sits in the pane
  const v = views[name], img = v.el.querySelector("img.cam"), f = v.el.querySelector(".frame");
  Object.assign(f.style, {left: `${img.offsetLeft}px`, top: `${img.offsetTop}px`,
                          width: `${img.offsetWidth}px`, height: `${img.offsetHeight}px`});
}
addEventListener("resize", () => { fit("finder"); fit("main"); });
function showFocus(name, value, stars, mode) {  // higher is sharper: turn the focuser to maximize it
  const v = views[name], box = v.el.querySelector(".focus");
  if (value === null) { box.querySelector("b").textContent = ""; box.querySelector("small").textContent = ""; return; }
  const x = Number(value);
  v.focus.push(x); if (v.focus.length > 60) v.focus.shift();
  const best = Math.max(...v.focus);
  box.querySelector("b").textContent = `focus ${x.toFixed(0)}`;
  box.querySelector("small").textContent = `${mode === "planet" ? "edge" : `${stars} stars`} · best ${best.toFixed(0)}`;
  const c = box.querySelector("canvas"), g = c.getContext("2d"), lo = Math.min(...v.focus);
  g.clearRect(0, 0, c.width, c.height); g.strokeStyle = getComputedStyle(document.body).color; g.beginPath();
  v.focus.forEach((f, i) => { const px = i * c.width / 59, py = c.height - 2 - (f - lo) / Math.max(best - lo, 1e-6) * (c.height - 4);
                              i ? g.lineTo(px, py) : g.moveTo(px, py); });
  g.stroke();
}
document.querySelectorAll(".view").forEach(el => {
  const name = el.id.slice(2), v = views[name];
  el.querySelectorAll(".ctl button").forEach(b => b.onclick = () => {
    if (b.dataset.b) { v.b = Math.min(4, Math.max(0.25, v.b * (b.dataset.b === "+" ? 1.4 : 1 / 1.4)));
                       el.querySelector("img.cam").style.setProperty("--b", (document.body.classList.contains("day") ? 1 : .6) * v.b); }
    if ("z" in b.dataset) { v.zoom = v.zoom === 4 ? 1 : v.zoom * 2; b.textContent = `${v.zoom}x`;
                            wsSend(JSON.stringify({type: "camera", camera: name, zoom: v.zoom})); drawMainBox(); }
  });
});

// The main camera's field on the finder view (Align measures it), scaled with the finder's zoom.
let mainBox = null;
function drawMainBox() {
  const poly = $("mainbox"), z = views.finder.zoom;
  poly.setAttribute("points", mainBox ? mainBox.map(([x, y]) => `${x * z},${y * z}`).join(" ") : "");
}

// --- pointing: the arrow on the finder view says which way to push; distance below it.
const arrow = $("arrow"), dist = $("dist");
let stateAt = 0, holding = false;
function guide(m) {
  holding = false; stateAt = performance.now(); arrow.hidden = false;
  if (m.on_target) { arrow.textContent = "●"; arrow.style.transform = ""; dist.textContent = `On ${m.target}`; return; }
  arrow.textContent = "↑";
  // Screen up = push up; screen right = the user's right (learned server-side, G3).
  const right = m.right_is_plus_az === false ? -m.d_az_sky_deg : m.d_az_sky_deg;
  arrow.style.transform = `rotate(${Math.atan2(right, m.d_alt_deg) * 180 / Math.PI}deg)`;
  const d = m.distance_deg;
  dist.textContent = `${m.target}: ${d >= 1 ? `${d.toFixed(0)}°` : `${(d * 60).toFixed(0)}′`}`;
}
setInterval(() => {  // guidance stopped (stop, unsafe, disconnect): no stale arrow
  if (performance.now() - stateAt > 1000 && !holding && !arrow.hidden) { arrow.hidden = true; dist.textContent = ""; }
}, 250);

// --- capture: one button starts and stops; progress shows on the main view.
let capturing = false;
const inset = $("inset");
function showCapture(m) {
  capturing = m.state === "recording" || m.state === "paused";
  $("capture").textContent = capturing ? "Stop capture" : "Capture";
  $("capture").classList.toggle("on", capturing);
  $("recenter").textContent = m.state === "paused" ? "Resume" : "Recenter";
  $("recenter").classList.toggle("on", m.state === "paused");
  const edge = m.edge_s === null || m.edge_s === undefined ? "" : ` · edge in ${m.edge_s} s`;
  $("capinfo").textContent = m.state === "recording" ? `● ${m.name}: ${m.frames} frames, ${m.seconds} s${edge}`
    : m.state === "paused" ? `Paused (${m.frames} frames): follow the arrow, then Resume`
    : m.state === "processing" ? `Saved ${m.frames} frames: making the picture…`
    : m.state === "done" ? "Picture ready (Pictures)" : "";
  $("capinfo").classList.toggle("warn", m.state === "recording" && m.edge_s !== null && m.edge_s <= 15);
  const f = $("field"), xy = m.kind === "stack" && m.state === "recording" ? m.target_xy : null;
  f.hidden = !xy;
  const z = views.main.zoom;  // the view's zoom crops the center
  if (xy) { f.style.left = `${(0.5 + (xy[0] - 0.5) * z) * 100}%`; f.style.top = `${(0.5 + (xy[1] - 0.5) * z) * 100}%`; }
}

// --- buttons
$("capture").onclick = () => action("capture");
$("stop").onclick = () => action("stop");
$("align").onclick = () => action("align");
$("recenter").onclick = () => action("recenter");
$("focus").onclick = () => { const on = document.body.classList.toggle("focusing");
  $("focus").classList.toggle("on", on); if (on) action("focus"); };
$("sync").onclick = () => action("sync");
document.querySelectorAll("[data-text]").forEach(b => b.onclick = () => sendText(b.dataset.text));
const open = id => { $(id).hidden = false; }, close = el => { el.closest(".sheet").hidden = true; };
document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => close(b));
msgEl.onclick = () => { $("log").textContent = logLines.slice().reverse().join("\n") || "No messages yet."; open("s-log"); };
$("goto").onclick = async () => {
  open("s-goto"); $("targets").textContent = "Loading…";
  try {
    const list = await (await fetch("/api/targets")).json();
    $("targets").innerHTML = list.map(t => `<button data-name="${t.name}" class="${t.up ? "" : "down"}">${t.name}
      <small>${t.category} · ${t.up ? `${t.alt.toFixed(0)}° up` : "below the trees or horizon now"} · ${t.note}</small></button>`).join("")
      || "Nothing good is up.";
    $("targets").querySelectorAll("button").forEach(b => b.onclick = () => { action("goto", b.dataset.name); $("s-goto").hidden = true; });
  } catch (e) { $("targets").textContent = `Couldn't load the list: ${e.message}`; }
};
$("more").onclick = async () => {
  open("s-more");
  try { const r = await fetch("/api/debug"); $("debugbox").textContent = r.ok ? formatDebug(await r.json()) : await r.text(); }
  catch (e) { $("debugbox").textContent = e.message; }
};
const formatDebug = info => Object.entries(info).map(([section, vals]) => section.toUpperCase() + "\n" +
  Object.entries(vals).map(([k, v]) => `  ${k}: ${JSON.stringify(v)}`).join("\n")).join("\n\n");
$("mode").onclick = e => {
  e.target.textContent = document.body.classList.toggle("day") ? "Night mode" : "Day mode";
  for (const [name, v] of Object.entries(views))  // keep each view's own brightness
    v.el.querySelector("img.cam").style.setProperty("--b", (document.body.classList.contains("day") ? 1 : .6) * v.b);
};

// --- pictures: a grid; tapping one opens it in the viewer (a new window crashed the installed app).
const demo = new URLSearchParams(location.search).get("demo");
const DEMO_PICTURES = ["m42", "m31", "m45", "jupiter", "saturn", "moon"].map(n => `/demo/${n}.jpg`);
async function showPictures() {
  const urls = demo ? DEMO_PICTURES : (await (await fetch("/gallery")).json()).map(f => `/pictures/${f}`);
  $("pictures").innerHTML = urls.length ? urls.map(u => `<button><img src="${u}" alt="${u}"></button>`).join("") : "No pictures yet.";
}
$("pics").onclick = () => { open("s-pics"); showPictures(); };
let viewerB = 1;
$("pictures").onclick = e => { const img = e.target.closest("button")?.querySelector("img"); if (img) openViewer(img.src); };
inset.onclick = () => openViewer(inset.src);
function openViewer(src) { const img = $("viewer").querySelector("img"); img.src = src; img.style.transform = ""; open("viewer"); }
document.querySelectorAll("[data-vb]").forEach(b => b.onclick = () => {
  viewerB = Math.min(4, Math.max(0.25, viewerB * (b.dataset.vb === "+" ? 1.4 : 1 / 1.4)));
  $("viewer").querySelector("img").style.setProperty("--b", .6 * viewerB);
});
document.querySelectorAll("[data-vz]").forEach(b => b.onclick = () => { $("viewer").querySelector("img").style.transform = `scale(${b.dataset.vz})`; });

// --- tablet GPS for the observing site (setup, or "use my location"). Needs HTTPS.
function sendLocation(id) {  // echo the request id so stale answers can be ignored
  if (!navigator.geolocation) { wsSend(JSON.stringify({type: "location_error", id, message: "This browser has no location service."})); return; }
  navigator.geolocation.getCurrentPosition(
    p => wsSend(JSON.stringify({type: "location", id, lat: p.coords.latitude, lon: p.coords.longitude, alt: p.coords.altitude, accuracy: p.coords.accuracy})),
    e => wsSend(JSON.stringify({type: "location_error", id, message: e.message})),
    {enableHighAccuracy: true, timeout: 20000, maximumAge: 0});  // always a fresh fix
}

// --- status line: what's connected (problems underlined and bold: it's all red at night), and
// a reload by itself when a new version is deployed.
let build = null;
async function pollStatus() {
  const link = ws && ws.readyState === WebSocket.OPEN;
  const item = (name, ok, why) => ok === null || ok === undefined ? "" :
    `<span class="${ok ? "" : "bad"}">${name} ${ok ? "✓" : "✗" + (why ? " " + why : "")}</span>`;
  let s = {};
  if (link) { try { const r = await fetch("/api/status"); if (r.ok) s = await r.json(); } catch {} }
  if (s.build) { if (build && s.build !== build) { location.reload(); return; } build = s.build; }
  mainBox = s.main_box || mainBox; drawMainBox();
  $("status").innerHTML = [item("Tablet link", link, link ? "" : "reconnecting"), item("Finder", s.finder),
    item("Main camera", s.main), item("Encoders", s.encoders), item("Internet", s.internet),
    s.claude ? item("Claude", s.claude === "ok", s.claude === "ok" ? "" : `(${s.claude})`) : ""].filter(Boolean).join("");
  $("checks").hidden = !s.daytime; $("checksoff").checked = !!s.checks_off;
}
$("checksoff").onchange = e => wsSend(JSON.stringify({type: "checks", off: e.target.checked}));
setInterval(pollStatus, 5000); setTimeout(pollStatus, 1000);

connect();
viewLoop("finder"); viewLoop("main");
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").then(r => r.update());  // installable (V1)
if (navigator.wakeLock) navigator.wakeLock.request("screen").catch(() => {});  // keep the tablet awake

// GUI design demo (scripts/dev/sim_pictures.py): ?demo=m42 (or m31, m45) plays a made-up live
// stack in the main view, then Pictures shows the made-up pictures.
if (demo) (async () => {
  for (let n = 1; n <= 10; n++) {
    handle({type: "live", url: `/demo/${demo}_${String(n).padStart(2, "0")}.jpg`, frames: n * 6});
    handle({type: "capture", state: "recording", name: demo.toUpperCase(), frames: n * 6, seconds: n * 2});
    await sleep(1500);
  }
  handle({type: "capture", state: "processing", frames: 60});
  await sleep(1500);
  handle({type: "picture"});
})();
</script>
</body>
