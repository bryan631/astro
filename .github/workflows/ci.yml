name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Branch protection requires a check named "test": it passes only if every Python passes.
  test:
    needs: pytest
    if: ${{ always() }}  # a skipped check would count as passing: always run, and fail
    runs-on: ubuntu-latest  # unless every Python version passed
    steps:
      - run: test "${{ needs.pytest.result }}" = success

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # normally ~2 min: a hung test fails fast
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.14"]  # dev box; Ubuntu 24.04 and 26.04 on the MiniPC
    env:
      ASTRO_SIM: "1"
      ASTRO_REQUIRE_SOLVER: "1"  # fail, not skip, if the solver is missing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: PIP=pip scripts/install-solver.sh
      - run: ruff check .
      - run: pytest -q

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - run: |
          arduino-cli core update-index
          arduino-cli core install arduino:megaavr arduino:avr
          arduino-cli lib install "Adafruit BME280 Library" OneWire DallasTemperature
      - run: arduino-cli compile --fqbn arduino:megaavr:nona4809:mode=off firmware/astro_mcu
      - run: arduino-cli compile --fqbn arduino:avr:nano:cpu=atmega328old firmware/astro_mcu
