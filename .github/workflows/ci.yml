name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ASTRO_SIM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pip install --no-deps "git+https://github.com/smroid/cedar-solve@607e3f8da7db0743bb6a26037e21c40b6befe49a"
      - run: ruff check .
      - run: pytest -q
